<!DOCTYPE html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Причастный оборот — 7 класс</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3f9;color:#182943;font:17px/1.6 Arial,sans-serif}main{max-width:960px;margin:auto;padding:28px 18px}header{display:flex;justify-content:space-between;gap:12px;color:#526580;font-size:14px}h1{font-size:clamp(30px,5vw,48px);line-height:1.15;margin:26px 0 16px}h2{font-size:22px}section{background:white;padding:clamp(18px,4vw,36px);border-radius:22px;margin:20px 0;border:1px solid #dce5f0}button{font:inherit;cursor:pointer;border:1px solid #bccce0;background:#fff;color:#18375e;border-radius:10px;padding:10px 15px;min-height:44px}button:hover{background:#e9f1ff}button:focus-visible{outline:3px solid #f29f29;outline-offset:2px}.primary{background:#205fd4;color:white;border:0}.primary:hover{background:#1749a5}.chosen{background:#205fd4!important;color:white!important}.controls{display:flex;gap:10px;flex-wrap:wrap}.muted{color:#526580;font-size:15px}.sentence{font-size:22px;line-height:2.7;margin:24px 0}.word{padding:4px 8px;margin:3px 1px;border-color:transparent}.gap{padding:2px;width:34px;border-style:dashed;color:#526580}.feedback{padding:18px;background:#edf3fc;border-radius:12px;margin:18px 0}.ok{color:#12603e}.bad{color:#a52f29}progress{width:100%;height:8px;accent-color:#205fd4}label{display:block;margin:12px 0}select{font:inherit;padding:8px;max-width:100%}details{margin:18px 0}summary{cursor:pointer}button:disabled{cursor:default;opacity:.7}.badge{background:#e9f0fb;padding:4px 10px;border-radius:8px}footer{font-size:13px;color:#526580;margin-top:28px}</style><main><header><b>РУССКИЙ ЯЗЫК / 7 КЛАСС</b><span>Практикум · 30 предложений</span></header><h1>Причастный оборот</h1><p class="muted">Найди определяемое слово, выдели оборот, расставь запятые.</p><div id="app"></div><footer>За каждое верное действие — 1 балл. За предложение — до 3 баллов. Ответ учитывается один раз.</footer></main><script>
const bank=[{"words": ["Тропинка", "ведущая", "к", "реке", "петляла", "между", "деревьями"], "head": 0, "span": [1, 2, 3], "commas": [0, 3], "kind": "after"}, {"words": ["Мы", "заметили", "лодку", "привязанную", "к", "старому", "причалу"], "head": 2, "span": [3, 4, 5, 6], "commas": [2], "kind": "after"}, {"words": ["Листья", "опавшие", "за", "ночь", "покрыли", "дорожку"], "head": 0, "span": [1, 2, 3], "commas": [0, 3], "kind": "after"}, {"words": ["На", "столе", "лежало", "письмо", "написанное", "мелким", "почерком"], "head": 3, "span": [4, 5, 6], "commas": [3], "kind": "after"}, {"words": ["Мальчик", "сидевший", "у", "окна", "читал", "журнал"], "head": 0, "span": [1, 2, 3], "commas": [0, 3], "kind": "after"}, {"words": ["Туристы", "подошли", "к", "мосту", "построенному", "через", "овраг"], "head": 3, "span": [4, 5, 6], "commas": [3], "kind": "after"}, {"words": ["Фонарь", "освещавший", "узкую", "улицу", "внезапно", "погас"], "head": 0, "span": [1, 2, 3], "commas": [0, 3], "kind": "after"}, {"words": ["Мы", "любовались", "облаками", "окрашенными", "лучами", "заката"], "head": 2, "span": [3, 4, 5], "commas": [2], "kind": "after"}, {"words": ["Книга", "найденная", "на", "верхней", "полке", "оказалась", "сборником", "рассказов"], "head": 0, "span": [1, 2, 3, 4], "commas": [0, 4], "kind": "after"}, {"words": ["Вдали", "показался", "поезд", "приближавшийся", "к", "маленькой", "станции"], "head": 2, "span": [3, 4, 5, 6], "commas": [2], "kind": "after"}, {"words": ["На", "подоконнике", "стоял", "подаренный", "бабушкой", "цветок"], "head": 5, "span": [3, 4], "commas": [], "kind": "before"}, {"words": ["Мы", "рассматривали", "собранные", "на", "берегу", "камешки"], "head": 5, "span": [2, 3, 4], "commas": [], "kind": "before"}, {"words": ["Проложенная", "через", "лес", "дорога", "вела", "к", "деревне"], "head": 3, "span": [0, 1, 2], "commas": [], "kind": "before"}, {"words": ["Ребята", "обсуждали", "прочитанный", "на", "уроке", "рассказ"], "head": 5, "span": [2, 3, 4], "commas": [], "kind": "before"}, {"words": ["За", "оградой", "росли", "посаженные", "прошлой", "весной", "яблони"], "head": 6, "span": [3, 4, 5], "commas": [], "kind": "before"}, {"words": ["Художник", "показал", "нам", "нарисованный", "простым", "карандашом", "портрет"], "head": 6, "span": [3, 4, 5], "commas": [], "kind": "before"}, {"words": ["В", "шкафу", "хранились", "связанные", "моей", "сестрой", "варежки"], "head": 6, "span": [3, 4, 5], "commas": [], "kind": "before"}, {"words": ["Над", "лугом", "кружили", "прилетевшие", "с", "юга", "ласточки"], "head": 6, "span": [3, 4, 5], "commas": [], "kind": "before"}, {"words": ["Экскурсовод", "открыл", "украшенную", "резьбой", "дверь"], "head": 4, "span": [2, 3], "commas": [], "kind": "before"}, {"words": ["Мы", "остановились", "возле", "окружённого", "высокими", "соснами", "дома"], "head": 6, "span": [3, 4, 5], "commas": [], "kind": "before"}, {"words": ["Увлечённый", "чтением", "он", "не", "услышал", "звонка"], "head": 2, "span": [0, 1], "commas": [1], "kind": "pronoun"}, {"words": ["Она", "приглашённая", "на", "школьный", "праздник", "пришла", "заранее"], "head": 0, "span": [1, 2, 3, 4], "commas": [0, 4], "kind": "pronoun"}, {"words": ["Промокшие", "под", "дождём", "мы", "вошли", "в", "дом"], "head": 3, "span": [0, 1, 2], "commas": [2], "kind": "pronoun"}, {"words": ["Они", "вернувшиеся", "из", "похода", "рассказывали", "о", "горах"], "head": 0, "span": [1, 2, 3], "commas": [0, 3], "kind": "pronoun"}, {"words": ["Удивлённый", "неожиданной", "встречей", "я", "остановился"], "head": 3, "span": [0, 1, 2], "commas": [2], "kind": "pronoun"}, {"words": ["Ты", "занятый", "решением", "задачи", "не", "заметил", "моего", "прихода"], "head": 0, "span": [1, 2, 3], "commas": [0, 3], "kind": "pronoun"}, {"words": ["Окружённые", "любопытными", "ребятами", "вы", "показывали", "находку"], "head": 3, "span": [0, 1, 2], "commas": [2], "kind": "pronoun"}, {"words": ["Он", "освещённый", "светом", "фонаря", "стоял", "у", "калитки"], "head": 0, "span": [1, 2, 3], "commas": [0, 3], "kind": "pronoun"}, {"words": ["Встревоженная", "странным", "шумом", "она", "подошла", "к", "окну"], "head": 3, "span": [0, 1, 2], "commas": [2], "kind": "pronoun"}, {"words": ["Мы", "приглашённые", "на", "экскурсию", "собрались", "у", "музея"], "head": 0, "span": [1, 2, 3], "commas": [0, 3], "kind": "pronoun"}];
const rules={after:'Причастный оборот стоит после определяемого существительного и выделяется запятыми. Если оборот завершает предложение, после него ставится точка.',before:'Причастный оборот стоит перед определяемым существительным и не имеет добавочного обстоятельственного значения. Запятые не нужны.',pronoun:'Причастный оборот относится к личному местоимению и обособляется независимо от своего положения. В начале или конце предложения нужна одна запятая, в середине — две.'};
let ids=[],pos=0,stage=0,head=-1,span=[],commas=[],checked=false,score=0,errors=[],results=[],repeat=false;
const app=document.querySelector('#app');
function home(){app.innerHTML=`<section><h2>Три действия в каждом предложении</h2><p>1. Нажми на определяемое слово.<br>2. Отметь <b>все слова</b> причастного оборота.<br>3. Нажми на пунктирные кнопки между словами, чтобы поставить запятые. Если они не нужны, оставь кнопки пустыми.</p><details><summary>Вспомнить правило</summary><p>Причастный оборот — причастие с зависимыми словами. От определяемого слова к нему задаётся вопрос <b>какой?</b></p><p>После существительного — обособляется. Перед существительным без добавочного обстоятельственного значения — не обособляется. При личном местоимении — обособляется независимо от положения.</p></details><label>Порядок заданий <select id="order"><option value="mixed">Вперемешку</option><option value="sequence">По порядку: три группы по 10</option></select></label><button class="primary" onclick="start()">Начать тренировку</button><p class="muted">30 предложений · 90 баллов. Критерии: «5» — от 90%; «4» — от 75%; «3» — от 50%; «2» — ниже 50%. Повтор ошибок оценивается отдельно.</p></section>`}
function start(list){repeat=!!list;ids=list?[...list]:bank.map((_,i)=>i);if(!list&&document.querySelector('#order').value==='mixed')for(let i=ids.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}pos=score=0;errors=[];results=[];reset();render()}
function reset(){stage=0;head=-1;span=[];commas=[];checked=false}
function toggle(i){if(checked)return;if(stage===0)head=i;else{let a=stage===1?span:commas;let k=a.indexOf(i);if(k<0)a.push(i);else a.splice(k,1)}render()}
function sentence(q,answer=false){return q.words.map((w,i)=>w+(answer&&q.commas.includes(i)?',':'')).join(' ')+'.'}
function render(){let q=bank[ids[pos]];app.innerHTML=`<section><header><b>${repeat?'Повтор ошибок':'Тренировка'}</b><span>${pos+1} / ${ids.length} · ${score} бал.</span></header><progress value="${pos}" max="${ids.length}"></progress><h2>${['Шаг 1. Найди определяемое слово','Шаг 2. Выдели все слова оборота','Шаг 3. Расставь запятые'][stage]}</h2><p class="muted">${['Нажми на одно слово, от которого задаётся вопрос к причастию.','Нажимай на слова, чтобы включить их в оборот или убрать из выделения.','Нажимай на пунктирные кнопки. Повторное нажатие убирает запятую.'][stage]}</p><div class="sentence">${q.words.map((w,i)=>stage<2?`<button class="word ${(stage===0?head===i:span.includes(i))?'chosen':''}" aria-pressed="${stage===0?head===i:span.includes(i)}" onclick="toggle(${i})" ${checked?'disabled':''}>${w}</button>${i===q.words.length-1?'.':''}`:`<span>${w}</span>${i<q.words.length-1?` <button class="gap ${commas.includes(i)?'chosen':''}" aria-label="Запятая после слова ${w}" aria-pressed="${commas.includes(i)}" onclick="toggle(${i})" ${checked?'disabled':''}>${commas.includes(i)?',':'·'}</button> `:'.'}`).join(' ')}</div><div id="feedback" aria-live="polite"></div><div class="controls">${!checked&&stage>0?'<button onclick="stage--;render()">Назад</button>':''}${checked?'<button class="primary" onclick="next()">'+(pos===ids.length-1?'Показать результат':'Следующее предложение')+'</button>':`<button class="primary" onclick="advance()">${stage===2?'Проверить':'Далее'}</button>`}</div></section>`;if(checked)showFeedback()}
function advance(){if(stage===0&&head<0){document.querySelector('#feedback').textContent='Сначала выбери определяемое слово.';return}if(stage===1&&!span.length){document.querySelector('#feedback').textContent='Сначала выдели слова оборота.';return}if(stage<2){stage++;render();return}if(checked)return;let q=bank[ids[pos]],eq=(a,b)=>a.length===b.length&&a.every(v=>b.includes(v));let marks=[head===q.head,eq(span,q.span),eq(commas,q.commas)];let n=marks.filter(Boolean).length;score+=n;if(n<3)errors.push(ids[pos]);results.push({id:ids[pos],marks,n});checked=true;render()}
function showFeedback(){let q=bank[ids[pos]],r=results[results.length-1];document.querySelector('#feedback').innerHTML=`<div class="feedback"><b>${r.n===3?'Верно!':'Разберём ответ'} ${r.n} из 3 баллов</b><p>${['Определяемое слово','Границы оборота','Запятые'].map((t,i)=>`<span class="${r.marks[i]?'ok':'bad'}">${r.marks[i]?'✓':'✗'} ${t}</span>`).join('<br>')}</p><p><b>${sentence(q,true)}</b></p><p>Определяемое слово: <b>${q.words[q.head]}</b>.<br>Оборот: <b>${q.span.map(i=>q.words[i]).join(' ')}</b>.</p><p>${rules[q.kind]}</p>${!r.marks[0]?'<p>Определяемое слово называет того или то, чей признак обозначает причастие.</p>':''}${!r.marks[1]?'<p>В оборот входят причастие и все зависимые от него слова. Определяемое слово в оборот не входит.</p>':''}</div>`}
function next(){if(!checked)return;pos++;if(pos===ids.length){finish();return}reset();render()}
function finish(){let percent=Math.round(score/(ids.length*3)*100),grade=percent>=90?5:percent>=75?4:percent>=50?3:2;app.innerHTML=`<section><span class="badge">${repeat?'Повтор завершён':'Тренировка завершена'}</span><h2>${score} / ${ids.length*3} баллов · ${percent}%</h2><p>Оценка: <b>${grade}</b>. Полностью верных предложений: ${ids.length-errors.length} из ${ids.length}.</p><div class="controls">${errors.length?'<button class="primary" onclick="start(errors)">Повторить ошибки</button>':''}<button onclick="home()">Новая тренировка</button></div><details><summary>Ответы пройденных заданий</summary>${results.map(r=>{let q=bank[r.id];return `<p><b>${r.n}/3 · ${sentence(q,true)}</b><br>${rules[q.kind]}</p>`}).join('')}</details></section>`}
home();
</script></html>
